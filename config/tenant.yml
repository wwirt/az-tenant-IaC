tenant:
  display_name: "Contoso Tenant"
  domain_name: "contoso.onmicrosoft.com"

management_groups:
  - name: "mg-root"
    display_name: "Root Management Group"
    parent_id: null
  - name: "mg-platform"
    display_name: "Platform"
    parent_id: "mg-root"
  - name: "mg-landing-zones"
    display_name: "Landing Zones"
    parent_id: "mg-root"
  - name: "mg-identity"
    display_name: "Identity"
    parent_id: "mg-platform"
  - name: "mg-connectivity"
    display_name: "Connectivity"
    parent_id: "mg-platform"
  - name: "mg-management"
    display_name: "Management"
    parent_id: "mg-platform"
  - name: "mg-platform-dev"
    display_name: "Platform - Development"
    parent_id: "mg-platform"
  - name: "mg-workloads-dev"
    display_name: "Workloads - Development"
    parent_id: "mg-landing-zones"
  - name: "mg-workloads-prod"
    display_name: "Workloads - Production"
    parent_id: "mg-landing-zones"

subscriptions:
  - name: "Platform Services"
    alias: "platform-services"
    management_group_id: "mg-platform-dev"
    workload: "Development"
    environment: "dev"
  - name: "Application Workloads"
    alias: "app-workloads"
    management_group_id: "mg-workloads-dev"
    workload: "Development"
    environment: "dev"
  - name: "Production Workloads"
    alias: "prod-workloads"
    management_group_id: "mg-workloads-prod"
    workload: "Production"
    environment: "prod"
  - name: "Identity Management"
    alias: "identity-mgmt"
    management_group_id: "mg-identity"
    workload: "Production"
    environment: "prod"
  - name: "Connectivity Hub"
    alias: "connectivity-hub"
    management_group_id: "mg-connectivity"
    workload: "Production"
    environment: "prod"
